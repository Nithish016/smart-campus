{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <div class="text-center mb-4">
            <h2>Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;" class="mt-1">Join VJIT Smart Campus</p>
        </div>
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Create a password">
            </div>
            <div class="form-group">
                <label for="role"><i class="fa-solid fa-user-tag"></i> Role</label>
                <select id="role" name="role" class="form-control" style="appearance: none; background-color: rgba(0,0,0,0.2);">
                    <option value="student" style="color: black;">Student</option>
                    <option value="admin" style="color: black;">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
        </form>
        <p class="text-center mt-3" style="font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-color);">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
